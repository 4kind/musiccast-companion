<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>MusicCast Companion</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="app">
            <!-- Left column: main window + search stacked -->
            <div class="stack">
                <!-- Main window: display, transport, volume -->
                <main class="window player">
                    <div class="titlebar">
                        <h1 class="titlebar-title">MusicCast Companion</h1>
                    </div>

                    <div class="panel">
                        <!-- Status display in LCD style -->
                        <div id="status-box" class="lcd">
                            <div class="lcd-status">
                                <span class="lcd-group">
                                    <span class="k">PWR</span>
                                    <span id="val-power">Loading...</span>
                                </span>
                                <span class="lcd-group">
                                    <span class="k">VOL</span>
                                    <span id="val-volume">...</span>
                                </span>
                                <span class="lcd-group lcd-device">
                                    <span class="k">YMC</span>
                                    <select id="yamaha-select" class="lcd-select" aria-label="Yamaha Device">
                                        <option value="">Loading devices...</option>
                                    </select>
                                </span>
                                <span class="lcd-group lcd-in">
                                    <span class="k">IN</span>
                                    <select id="input-select" class="lcd-select" aria-label="Input">
                                        <option value="">Loading inputs...</option>
                                    </select>
                                </span>
                            </div>

                            <!-- Stream / media information -->
                            <div id="media-info" class="lcd-media hidden">
                                <div class="lcd-now">
                                    <img id="val-art" alt="Cover" class="lcd-art hidden" />
                                    <div class="lcd-titles">
                                        <div class="lcd-track-row">
                                            <div class="lcd-track" id="val-track">-</div>
                                            <!-- Favorite heart of the current Jellyfin
                                                 track (jellyfin_favorite in /api/playinfo);
                                                 hidden for non-Jellyfin playback. Click toggles. -->
                                            <span id="val-fav" class="lcd-fav" data-fav="false" title="Toggle favorite" aria-label="Toggle favorite" aria-pressed="false" hidden>&#9829;</span>
                                        </div>
                                        <div class="lcd-sub" id="val-artist">-</div>
                                        <div class="lcd-sub lcd-album" id="val-album">-</div>
                                    </div>
                                </div>

                                <!-- Playback time of current track (Yamaha
                                     play_time/total_time, seconds). total_time is
                                     0 for radio/streams -> row stays hidden. -->
                                <div id="time-row" class="hidden">
                                    <div class="lcd-time">
                                        <span id="val-elapsed">0:00</span>
                                        <span class="lcd-time-sep">/</span>
                                        <span id="val-total">0:00</span>
                                    </div>
                                    <div class="seek">
                                        <div id="val-progress" style="width: 0%"></div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Transport controls -->
                        <div class="controls">
                            <button id="btn-prev" class="btn btn-icon" title="Previous Track" aria-label="Previous Track">
                                &#9668;&#9668;
                            </button>
                            <button id="btn-play" class="btn btn-icon" title="Play" aria-label="Play">
                                &#9654;
                            </button>
                            <button id="btn-stop" class="btn btn-icon" title="Stop" aria-label="Stop">
                                &#9632;
                            </button>
                            <button id="btn-next" class="btn btn-icon" title="Next Track" aria-label="Next Track">
                                &#9658;&#9658;
                            </button>
                            <button id="btn-random" class="btn" title="Play Random Track" aria-pressed="false">
                                RANDOM
                            </button>
                        </div>

                        <!-- Volume; max is set at runtime from getStatus -> max_volume
                             (not 0-100, device can be 0-161). -->
                        <div class="vol">
                            <span class="k">VOL</span>
                            <input
                                id="volume-slider"
                                type="range"
                                min="0"
                                max="161"
                                value="80"
                                aria-label="Volume"
                            />
                        </div>
                    </div>
                </main>

                <!-- Jellyfin music search -->
                <section id="search-panel" class="window">
                    <div class="titlebar">
                        <h2 class="titlebar-title">Jellyfin - Search</h2>
                    </div>

                    <div class="panel">
                        <div class="searchbar">
                            <input
                                id="search-input"
                                type="text"
                                class="text-input"
                                placeholder="Artist, Album, Track..."
                                autocomplete="off"
                                aria-label="Search term"
                            />
                            <button id="btn-search" class="btn">SEARCH</button>
                        </div>

                        <!-- Filter (All/Albums/Artists/Tracks): Radio + Label, toggle via CSS -->
                        <div id="search-filters" class="chip-group hidden">
                            <input type="radio" name="search-filter" id="filter-all" class="sr-only" checked />
                            <label for="filter-all">All</label>
                            <input type="radio" name="search-filter" id="filter-albums" class="sr-only" />
                            <label for="filter-albums">Albums <span data-count></span></label>
                            <input type="radio" name="search-filter" id="filter-artists" class="sr-only" />
                            <label for="filter-artists">Artists <span data-count></span></label>
                            <input type="radio" name="search-filter" id="filter-tracks" class="sr-only" />
                            <label for="filter-tracks">Tracks <span data-count></span></label>
                        </div>

                        <!-- Search results; dynamically filled -->
                        <div id="search-results" class="list hidden"></div>
                    </div>
                </section>

                <!-- Queue: current Jellyfin context (album list with position,
                     or random mode with history). Filled from /api/queue. -->
                <section id="queue-panel" class="window">
                    <div class="titlebar">
                        <h2 class="titlebar-title">Queue</h2>
                    </div>
                    <div class="panel">
                        <div id="queue-results" class="list"></div>
                    </div>
                </section>
            </div>

            <!-- Right column: Browse as Playlist Editor -->
            <section id="browse-panel" class="window">
                <div class="titlebar">
                    <h2 class="titlebar-title">Playlist Editor - Browse</h2>
                </div>

                <div class="panel">
                    <!-- Libraries: only visible from two entries, JS fills them -->
                    <div id="browse-libraries" class="chip-group hidden"></div>

                    <!-- Type and sorting: radios + labels, CSS controls which chips apply -->
                    <div id="browse-kinds" class="chip-group">
                        <input type="radio" name="browse-kind" id="browse-kind-artists" value="artists" class="sr-only" checked />
                        <label for="browse-kind-artists">Album Artists</label>
                        <input type="radio" name="browse-kind" id="browse-kind-albums" value="albums" class="sr-only" />
                        <label for="browse-kind-albums">Albums</label>
                        <input type="radio" name="browse-kind" id="browse-kind-favorites" value="favorites" class="sr-only" />
                        <label for="browse-kind-favorites">Favorites</label>
                    </div>
                    <div id="browse-sorts" class="chip-group">
                        <input type="radio" name="browse-sort" id="browse-sort-name" value="name" class="sr-only" checked />
                        <label for="browse-sort-name">A-Z</label>
                        <input type="radio" name="browse-sort" id="browse-sort-newest" value="newest" class="sr-only" />
                        <label for="browse-sort-newest">Newest</label>
                        <input type="radio" name="browse-sort" id="browse-sort-mostplayed" value="mostplayed" class="sr-only" />
                        <label for="browse-sort-mostplayed">Most played</label>
                        <input type="radio" name="browse-sort" id="browse-sort-random" value="random" class="sr-only" />
                        <label for="browse-sort-random">Random</label>
                    </div>

                    <!-- A-Z jump; continue scrolling within the letter -->
                    <div id="browse-letters" class="chip-group">
                        <button type="button" class="chip" data-letter="" aria-pressed="true">All</button>
                        <button type="button" class="chip" data-letter="A">A</button>
                        <button type="button" class="chip" data-letter="B">B</button>
                        <button type="button" class="chip" data-letter="C">C</button>
                        <button type="button" class="chip" data-letter="D">D</button>
                        <button type="button" class="chip" data-letter="E">E</button>
                        <button type="button" class="chip" data-letter="F">F</button>
                        <button type="button" class="chip" data-letter="G">G</button>
                        <button type="button" class="chip" data-letter="H">H</button>
                        <button type="button" class="chip" data-letter="I">I</button>
                        <button type="button" class="chip" data-letter="J">J</button>
                        <button type="button" class="chip" data-letter="K">K</button>
                        <button type="button" class="chip" data-letter="L">L</button>
                        <button type="button" class="chip" data-letter="M">M</button>
                        <button type="button" class="chip" data-letter="N">N</button>
                        <button type="button" class="chip" data-letter="O">O</button>
                        <button type="button" class="chip" data-letter="P">P</button>
                        <button type="button" class="chip" data-letter="Q">Q</button>
                        <button type="button" class="chip" data-letter="R">R</button>
                        <button type="button" class="chip" data-letter="S">S</button>
                        <button type="button" class="chip" data-letter="T">T</button>
                        <button type="button" class="chip" data-letter="U">U</button>
                        <button type="button" class="chip" data-letter="V">V</button>
                        <button type="button" class="chip" data-letter="W">W</button>
                        <button type="button" class="chip" data-letter="X">X</button>
                        <button type="button" class="chip" data-letter="Y">Y</button>
                        <button type="button" class="chip" data-letter="Z">Z</button>
                    </div>

                    <!-- List; the sentinel at the end triggers loading more -->
                    <div id="browse-results" class="list">
                        <div id="browse-sentinel" class="sentinel"></div>
                    </div>
                    <p id="browse-status" class="status hidden"></p>
                </div>
            </section>
        </div>

        <!-- Templates for result list: markup is in HTML, JS only fills text
             and clones. Expand/collapse handled by <details>/<summary>. -->
        <template id="tpl-section">
            <div data-section>
                <p class="section-label" data-section-label></p>
                <div class="section-list" data-section-list></div>
            </div>
        </template>

        <template id="tpl-album">
            <details class="row" data-kind="album">
                <summary class="row-main">
                    <span class="row-cover" data-slot="cover"></span>
                    <span class="row-text">
                        <span class="row-title" data-slot="title"></span>
                        <span class="row-sub" data-slot="sub"></span>
                    </span>
                    <span class="row-dur" data-slot="duration"></span>
                    <button type="button" data-action="play" class="btn" title="Play" aria-label="Play">
                        &#9654;
                    </button>
                </summary>
                <div class="row-body" data-slot="body"></div>
            </details>
        </template>

        <template id="tpl-artist">
            <details class="row" data-kind="artist">
                <summary class="row-main">
                    <span class="row-cover" data-slot="cover"></span>
                    <span class="row-text">
                        <span class="row-title" data-slot="title"></span>
                        <span class="row-sub" data-slot="sub"></span>
                    </span>
                    <button type="button" data-action="play" class="btn" title="Play" aria-label="Play">
                        &#9654;
                    </button>
                </summary>
                <div class="row-body" data-slot="body"></div>
            </details>
        </template>

        <template id="tpl-track">
            <button type="button" class="row row-track" data-kind="track" data-action="play" title="Play">
                <span class="row-num" data-slot="number"></span>
                <span class="row-cover" data-slot="cover"></span>
                <span class="row-text">
                    <span class="row-title" data-slot="title"></span>
                    <span class="row-sub" data-slot="sub"></span>
                </span>
                <span class="row-dur" data-slot="duration"></span>
            </button>
        </template>

        <template id="tpl-album-track">
            <button type="button" class="row-line" data-kind="track" data-action="play">
                <span data-slot="title"></span>
                <span class="row-fav" data-slot="fav" title="Toggle favorite" aria-label="Toggle favorite" aria-pressed="false">&#9829;</span>
                <span class="row-dur" data-slot="duration"></span>
            </button>
        </template>

        <!-- External JavaScript file -->
        <script src="app.js"></script>
    </body>
</html>
